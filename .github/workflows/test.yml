name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: npm clean-install
      - name: Check format
        run: npm run prettier:check
  test:
    name: Testing
    needs: format
    continue-on-error: true
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-24.04
          - ubuntu-26.04-arm
          - ubuntu-24.04-arm
          - macos-14
          - macos-15
          - macos-26
          - macos-15-intel
          - macos-26-intel
          - macos-latest
          - xcode-27
          - windows-2022
          - windows-2025
          - windows-11-arm
          - windows-latest
        node-version: [22, 24, 25, 26, current, lts/*, latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm clean-install
      - name: Run tests
        run: npm run test -- --coverage.enabled true
      - name: Report Coverage
        uses: davelosert/vitest-coverage-report-action@v2
      - name: Benchmark
        run: npm run bench
